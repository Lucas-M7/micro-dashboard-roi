<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
      content="Dashboard de gerenciamento de campanhas e cálculo de ROI" />
    <title>ROI Tracker - Dashboard</title>
  </head>

  <body>
    <div class="d-flex" style="min-height: 100vh">

      <aside class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark"
        style="width: 200px">
        <a href="/"
          class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
          <span class="fs-4 fw-bold">🚀 ROI Tracker</span>
        </a>
        <hr />
        <nav>
          <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
              <a href="#" class="nav-link active"
                aria-current="page">Dashboard</a>
            </li>
            <li>
              <a href="#" class="nav-link text-white">Campanhas</a>
            </li>
          </ul>
        </nav>
        <hr />
        <div class="d-flex align-items-center">
          <img
            src="https://github.com/mdo.png"
            alt="Foto de perfil do Admin"
            width="32"
            height="32"
            class="rounded-circle me-2" />
          <strong>Admin</strong>
        </div>
      </aside>

      <main class="flex-grow-1 p-4">
        <div class="container-fluid">

          <header
            class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom border-secondary">
            <h1 class="h2 text-dark">Dashboard Geral</h1> <div
              class="btn-toolbar mb-2 mb-md-0">
              <button type="button" class="btn btn-sm btn-outline-secondary"
                onclick="window.location.reload()">
                🔄 Atualizar
              </button>
            </div>
          </header>

          <section class="row g-4 mb-4" aria-label="Métricas Principais">

            <div class="col-md-4">
              <article
                class="card bg-dark text-white border-primary h-100 shadow-sm"
                style="border-left: 5px solid #0d6efd !important;">
                <div class="card-body">
                  <h2 class="card-title text-uppercase"
                    style="font-size: 0.8rem;">Total Investido</h2>
                  <p class="card-text fs-2 fw-bold text-primary mb-0">
                    <data id="val-spend" value="0">R$ 0,00</data>
                  </p>
                </div>
              </article>
            </div>

            <div class="col-md-4">
              <article
                class="card bg-dark text-white border-success h-100 shadow-sm"
                style="border-left: 5px solid #198754 !important;">
                <div class="card-body">
                  <h2 class="card-title text-uppercase"
                    style="font-size: 0.8rem;">Faturamento Total</h2>
                  <p class="card-text fs-2 fw-bold text-success mb-0">
                    <data id="val-revenue" value="0">R$ 0,00</data>
                  </p>
                </div>
              </article>
            </div>

            <div class="col-md-4">
              <article
                class="card bg-dark text-white border-warning h-100 shadow-sm"
                style="border-left: 5px solid #ffc107 !important;">
                <div class="card-body">
                  <h2 class="card-title text-uppercase"
                    style="font-size: 0.8rem;">ROI Geral</h2>
                  <p class="card-text fs-2 fw-bold text-warning mb-0">
                    <data id="val-roi" value="0">0%</data>
                  </p>
                  <small class="text-secondary">Meta: 150%</small>
                </div>
              </article>
            </div>

          </section>

          <section class="row" aria-label="Lista de Campanhas">
            <div class="col-12">
              <div
                class="d-flex justify-content-between align-items-center mt-4 mb-3">
                <h3 class="h4">Campanhas Recentes</h3>
                <button class="btn btn-primary" data-bs-toggle="modal"
                  data-bs-target="#modalNovaCampanha">
                  + Nova Campanha
                </button>
              </div>

              <div class="table-responsive bg-dark rounded shadow-sm p-3"
                style="border: 1px solid #2d2d44;">
                <table class="table table-dark table-hover align-middle mb-0">
                  <thead>
                    <tr>
                      <th scope="col"
                        class="text-secondary text-uppercase fs-7">ID</th>
                      <th scope="col"
                        class="text-secondary text-uppercase fs-7">Nome</th>
                      <th scope="col"
                        class="text-secondary text-uppercase fs-7">Produto</th>
                      <th scope="col"
                        class="text-secondary text-uppercase fs-7 text-end">ROI</th>
                      <th scope="col"
                        class="text-secondary text-uppercase fs-7 text-end">Ações</th>
                    </tr>
                  </thead>
                  <tbody id="tabela-corpo">
                  </tbody>
                </table>
              </div>
            </div>
          </section>

        </div>
      </main>
    </div>

    <div class="modal fade" id="modalNovaCampanha" tabindex="-1"
      aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white border-secondary">
          <div class="modal-header border-secondary">
            <h5 class="modal-title">🚀 Criar Nova Campanha</h5>
            <button type="button" class="btn-close btn-close-white"
              data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="formNovaCampanha">
              <div class="mb-3">
                <label for="campanhaNome" class="form-label">Nome da
                  Campanha</label>
                <input type="text"
                  class="form-control bg-dark text-white border-secondary"
                  id="campanhaNome" placeholder="Ex: Black Friday - Facebook"
                  required>
              </div>
              <div class="mb-3">
                <label for="campanhaProduto" class="form-label">Produto /
                  Oferta</label>
                <input type="text"
                  class="form-control bg-dark text-white border-secondary"
                  id="campanhaProduto" placeholder="Ex: Secaps Black" required>
              </div>
            </form>
          </div>
          <div class="modal-footer border-secondary">
            <button type="button" class="btn btn-outline-light"
              data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary"
              id="btnSalvarCampanha">Salvar Campanha</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalLogCampanha" tabindex="-1"
      aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white border-secondary">
          <div class="modal-header border-secondary">
            <h5 class="modal-title">💰 Adicionar Dados Diários</h5>
            <button type="button" class="btn-close btn-close-white"
              data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body">
            <input type="hidden" id="idCampanhaLog">
            <p class="text-secondary">Lançando dados para: <strong id="spanIdVisual"
                class="text-white">...</strong></p>

            <form id="formNovoLog">
              <div class="mb-3">
                <label for="logData" class="form-label">Data do Registro</label>
                <input type="date"
                  class="form-control bg-dark text-white border-secondary"
                  id="logData" required>
              </div>

              <div class="row">
                <div class="col-6 mb-3">
                  <label for="logSpend" class="form-label text-danger">Gasto
                    (R$)</label>
                  <input type="number" step="0.01"
                    class="form-control bg-dark text-white border-secondary"
                    id="logSpend" placeholder="0.00" required>
                </div>

                <div class="col-6 mb-3">
                  <label for="logRevenue"
                    class="form-label text-success">Faturamento (R$)</label>
                  <input type="number" step="0.01"
                    class="form-control bg-dark text-white border-secondary"
                    id="logRevenue" placeholder="0.00" required>
                </div>
              </div>
            </form>
          </div>

          <div class="modal-footer border-secondary">
            <button type="button" class="btn btn-outline-light"
              data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary"
              id="btnSalvarLog">Salvar Log</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
